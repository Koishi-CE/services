# CI 门禁流水线
#
# 两个并行 job：
# - gate   主门禁：安装 → lint → 类型检查 → 测试 → 构建 → 覆盖率 → 上传。
#          其中 lint / typecheck / test 与自研门禁五连（check:locales 等）逐条
#          对应本地 `bun run check` 的构成——两处口径必须逐字一致，否则会出现
#          「本地绿、CI 红」或反过来的假象。改动任一侧都要同步另一侧。
# - fallow 死代码与依赖审计：bunx 直跑，不进 devDependencies；版本在根
#          package.json 的 fallow 脚本内 pin 到精确版（3.25.0），避免门禁口径
#          随上游发布漂移。豁免与规则见根 .fallowrc.jsonc 与 .fallowrc.plugins.jsonc
#          （每条例外都附理由）。**刻意不并入 gate 的 check 链**：fallow 经 bunx
#          拉取，离线或网络抖动时会让主门禁红在「与代码无关」的地方；两个 job
#          各自独立上报，ruleset 里两个都要作为必需状态检查。
#
# job 名即主分支 ruleset「保护主分支」（id 24119346）里填的必需状态检查名
# （**ruleset 只认 job 名**，不含 workflow 名、矩阵与事件类型），改动此处须同步 ruleset。
#
# 顺序依赖（写在这里是因为它是隐性约束，不写就会被「顺手重排」打破）：
#   - 当前**不需要** build 前置于 typecheck / test：根 tsconfig.json 的 paths 指向
#     各包 `src/index.ts` 源码（不是 lib 产物），测试也经同一套 paths 解析到 src。
#     故干净检出、没有 lib/ 的情况下 typecheck 与 test 都能过——已实测。
#     一旦将来有 tsconfig 的 paths 改指 `packages/*/lib/*.d.ts`，或有测试去读
#     dist/lib 真实产物，**必须**把 build 提到它们之前（参照仓就是这么踩到
#     TS2307 与「干净环境整套用例必失败」的）。
#
# 触发面：merge_group 不可省。ruleset 启用 merge queue 后，GitHub 对必需检查只认
# 「在队列建的 gh-readonly-queue/<base>/pr-* 临时 ref 上跑出来的」那一次，
# pull_request 那次不算数：缺 merge_group 时队列永远等不到检查上报，超时（ruleset 的
# check_response_timeout_minutes，本仓 10 分钟）后把 PR 从队列里剔除，等于合并必然失败。
# 官方原文：「You must update your CI configuration to trigger and report on merge
# group events when requiring a merge queue.」
#
# 顺序纪律（硬约束）：本文件必须先带上 merge_group 并合并，**再**去打开 ruleset 的
# 必需状态检查。反了会把合并卡死，且现象是「队列超时剔单」而非报错，排查成本很高。
#
# Bun 版本不在此处硬编码：oven-sh/setup-bun 自动读根 package.json 的
# packageManager（bun@1.4.2），升级只改根字段即可。
#
# 覆盖率：Codecov 接入（2026-09-28）。ruleset 已开 code_coverage 规则
# （minimum_coverage 90 / max_coverage_drop 1），故覆盖率不是可选装饰——不产出
# 覆盖率报告时该规则会一直等不到数据。上传步骤排在末尾，且**排除 merge_group**：
# 队列那一遍与 pull_request 那一遍内容相同，重复上传只会用同一 commit 覆盖自己。
#
# 第三方 Action 一律钉到 commit SHA（附 `# vX.Y.Z` 注释供 Dependabot 与人工识别）：
# ruleset 的 code_scanning 规则（CodeQL，security_alerts_threshold = all）会把
# `actions/unpinned-tag` 告警算作阻塞项。实测 2026-09-28 因 `oven-sh/setup-bun@v2`
# 未钉 SHA 而产生 1 条 medium 告警（告警 3），会卡死所有 PR。Dependabot 的
# github-actions 条目会自动跟随新版本并改写 SHA 与注释（见 .github/dependabot.yml）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# 同一分支 / PR 的旧跑自动取消，不占额度。merge_group 的 ref 逐 entry 独立
# （gh-readonly-queue/... 带该 entry 的 sha），因此不会跨 entry 误取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # 锁文件格式守门（仅 Dependabot PR）：其 updater 镜像内的 Bun 版本不跟随仓库
      # packageManager，会把 lockfileVersion 2 的 bun.lock 静默降级重写
      # （dependabot-core#15848 / #15897），使 PR diff 被整份锁文件重排淹没、真实依赖
      # 变更不可评审。常规 PR 零影响；Bun 升级使基线前移时同步调整下方阈值。
      - name: 锁文件格式守门（仅 Dependabot PR）
        if: github.actor == 'dependabot[bot]'
        run: |
          bun -e '
            const text = await Bun.file("bun.lock").text();
            const match = /"lockfileVersion":\s*(\d+)/.exec(text);
            const version = match ? Number(match[1]) : 0;
            console.log(`bun.lock lockfileVersion=${match ? version : "<未找到>"}`);
            if (version < 2) {
              console.log("::error::bun.lock 的 lockfileVersion 低于基线 2，疑似被 Dependabot 的旧版 Bun 降级重写；请用仓库钉定的 Bun（根 package.json 的 packageManager）重新执行 bun install 后提交。");
              process.exit(1);
            }
          '
      # CI 环境下 bun install 自动 frozen-lockfile（锁文件与 package.json 不一致即失败），
      # 故此处不显式加 --frozen-lockfile，与参照仓口径一致。
      - run: bun install
      - name: lint（biome）
        run: bun run lint
      - name: 类型检查（TS7）
        run: bun run typecheck
      - name: 测试（bun:test）
        run: bun test
      # 自研门禁五连（tooling/checks/*）：词典 / 包纪律 / 文档链接 / PR 模板 /
      # SPDX 头。逐条与本地 `bun run check` 的构成对应，不合并成一条
      # `bun run check` 是为了让错误直接落在对应的步骤名上。
      # 新增或删除自研门禁时必须同步根 package.json 的 check 链与本段。
      - name: 自研门禁（tooling/checks）
        run: |
          bun run check:locales
          bun run check:packages
          bun run check:docs-links
          bun run check:pr-templates
          bun run check:spdx
      - name: 构建（按包 tsdown）
        run: bun run build
      # 覆盖率单独跑一遍、而非给上一步加旗标：让 CI 的「测试」与本地门禁
      # `bun run check` 里的 `bun test` 逐字一致，覆盖率的采集口径另立一行，便于对账
      # （本地可复现命令：bun test --isolate --coverage --coverage-reporter=lcov）。
      - name: 测试（覆盖率，供 Codecov）
        run: bun test --isolate --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - name: 上传覆盖率到 Codecov
        if: github.event_name != 'merge_group'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # 死代码与依赖审计。与 gate 并行且互不依赖：审计只需要源码与 package.json，
  # 不需要构建产物（fallow 从 tsconfig / package.json / 源码静态图分析）。
  # 刻意**不**跑 bun run build：本仓 tsconfig 的 paths 指向各包 src 源码，
  # 干净检出（无 lib/）下 fallow 的解析结果与本地一致；反过来若 CI 先构建，
  # 产物 lib/*.d.ts 会让判定口径与本地「未构建」状态漂移。
  fallow:
    name: fallow (dead code & deps audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - name: 死代码与依赖审计（fallow，版本 pin 在根 package.json）
        run: bun run fallow
